[pytest]
# Collect ONLY from tests/. The project root holds hand-run diagnostic scripts
# (browser/proxy probes) that open a real browser at import time; when one of
# those happened to be named test_*.py, a bare `pytest` aborted during
# collection with a browser error that had nothing to do with the code.
# run_tests.bat always passed tests/ explicitly, so this just makes a bare
# `pytest` behave the same way.
testpaths = tests
